<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DDG Staff Panel - Login</title>
    <link rel="icon" href="/resources/favicon.ico" type="image/x-icon">
    <link rel="icon" type="image/png" sizes="16x16" href="/resources/favicon-16x16.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/resources/favicon-32x32.png">
    <link rel="apple-touch-icon" href="/resources/apple-touch-icon.png">
    <link rel="manifest" href="/resources/site.webmanifest">
    <link rel="icon" type="image/png" sizes="192x192" href="/resources/android-chrome-192x192.png">
    <link rel="icon" type="image/png" sizes="512x512" href="/resources/android-chrome-512x512.png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a1a2e, #16213e);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .login-container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.2);
            max-width: 400px;
            width: 100%;
        }

        .logo {
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #4a90e2;
        }

        .subtitle {
            font-size: 18px;
            margin-bottom: 30px;
            color: #ccc;
        }

        .discord-login-btn {
            background-color: #5865F2;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            justify-content: center;
        }

        .discord-login-btn:hover {
            background-color: #4752C4;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }



        .discord-icon {
            width: 24px;
            height: 24px;
            background: url('https://discord.com/assets/2c21aeda16de354ba5334551a883b481.png') no-repeat center center;
            background-size: contain;
        }

        .error-message {
            background: rgba(255, 0, 0, 0.2);
            border: 1px solid rgba(255, 0, 0, 0.5);
            color: #ff6b6b;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .info-text {
            margin-top: 20px;
            font-size: 14px;
            color: #aaa;
            line-height: 1.5;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">DDG Staff Panel</div>
        <div class="subtitle">Prison Roleplay Management</div>
        
        <div id="error-message" class="error-message"></div>
        
        <a href="/auth/discord" class="discord-login-btn">
            <div class="discord-icon"></div>
            Sign in with Discord
        </a>
        
        <div class="info-text">
            You need to be authorized by an administrator to access the staff panel.
            <br><br>
            Contact a server administrator if you believe you should have access.
        </div>
    </div>

    <script>
        // Check for error parameter in URL
        const urlParams = new URLSearchParams(window.location.search);
        const error = urlParams.get('error');
        
        if (error === 'unauthorized') {
            const errorDiv = document.getElementById('error-message');
            errorDiv.textContent = 'Your Discord account is not authorized to access the staff panel.';
            errorDiv.style.display = 'block';
        }
    </script>
</body>
</html>
